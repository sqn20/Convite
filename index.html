<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Especial ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container das flores que vão subir de fundo -->
    <div class="background-flowers" id="flowersContainer"></div>

    <!-- O Envelope / Carta Clássica -->
    <div class="card-container">
        <div class="envelope" id="envelope">
            <!-- Botão menor escrito apenas clique -->
            <button class="open-btn" id="openBtn">clique</button>
            
            <!-- Conteúdo interno da carta com o novo texto -->
            <div class="letter-content" id="letterContent">
                <h2>Meu Amor,</h2>
                <p>Gostaria de lhe fazer um convite muito especial para uma noite ao meu lado.</p>
                <p>Ansiamos muito por este momento, então vamos jantar e aproveitar o que tem de melhor. ficarmos juntos!</p>
                <p>Então, Aceita Sair comigo?</p>
                
                <!-- Botões de resposta -->
                <div class="actions">
                    <button class="btn btn-accept" id="acceptBtn">Aceitar 😍</button>
                    <button class="btn btn-decline" disabled title="Essa opção não está disponível!">Recusar 😢</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
