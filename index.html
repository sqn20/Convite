<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Especial ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-flowers" id="flowersContainer"></div>

    <div class="card-container">
        <div class="envelope" id="envelope">
            <button class="open-btn" id="openBtn">Abrir para Você ✉️</button>
            
            <div class="letter-content" id="letterContent">
                <h2>Meu Amor,</h2>
                <p>Gostaria de lhe fazer um convite muito especial para uma noite inesquecível ao meu lado.</p>
                <p>Você aceita namorar comigo / sair comigo?</p>
                
                <div class="actions">
                    <button class="btn btn-accept" id="acceptBtn">Aceitar 😍</button>
                    <button class="btn btn-decline" disabled title="Essa opção não está disponível!">Recusar 😢</button>
                </div>
            </div>
        </div>
    </div>

    <script href="script.js" src="script.js"></script>
</body>
</html>
